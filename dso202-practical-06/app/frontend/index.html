<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Book</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f4f6fb;color:#182230}
    header{background:#173b68;color:white;padding:24px 7%}header h1{margin:0}
    main{max-width:900px;margin:28px auto;padding:0 18px}.panel{background:white;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 4px 18px #152a4410}
    form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
    input,select,button{font:inherit;padding:11px;border:1px solid #ccd4df;border-radius:8px}
    button{background:#1765ad;color:white;border:0;cursor:pointer}table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:10px;border-bottom:1px solid #e7ebf1}small{color:#667085}
    #status{margin-top:10px;color:#1765ad}
  </style>
</head>
<body>
<header><h1>Credit Book</h1><p>Simple credit and payment record demonstration</p></header>
<main>
  <section class="panel">
    <h2>Add a transaction</h2>
    <form id="entry">
      <input id="customer" placeholder="Customer name" required maxlength="80">
      <select id="type"><option value="CREDIT">Credit given</option><option value="PAYMENT">Payment received</option></select>
      <input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required>
      <input id="note" placeholder="Note (optional)" maxlength="200">
      <button type="submit">Save transaction</button>
    </form>
    <p id="status" role="status"></p>
  </section>
  <section class="panel">
    <h2>Transaction history</h2>
    <small>Demo data stored in PostgreSQL.</small>
    <div style="overflow-x:auto"><table><thead><tr><th>Customer</th><th>Type</th><th>Amount</th><th>Note</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>
<script>
const rows=document.querySelector("#rows"), statusBox=document.querySelector("#status");
async function load(){
  try{
    const r=await fetch("/api/transactions"); if(!r.ok) throw new Error("API request failed");
    const data=await r.json(); rows.innerHTML="";
    for(const x of data){
      const tr=document.createElement("tr");
      for(const v of [x.customer,x.type,Number(x.amount).toFixed(2),x.note||"",new Date(x.created_at).toLocaleString()]){
        const td=document.createElement("td"); td.textContent=v; tr.appendChild(td);
      } rows.appendChild(tr);
    }
    if(!data.length) rows.innerHTML="<tr><td colspan='5'>No transactions yet.</td></tr>";
  }catch(e){statusBox.textContent="Could not load records: "+e.message;}
}
document.querySelector("#entry").addEventListener("submit",async e=>{
  e.preventDefault(); statusBox.textContent="Saving...";
  const body={customer:document.querySelector("#customer").value,type:document.querySelector("#type").value,
    amount:Number(document.querySelector("#amount").value),note:document.querySelector("#note").value};
  try{
    const r=await fetch("/api/transactions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const data=await r.json(); if(!r.ok) throw new Error(data.error||"Save failed");
    statusBox.textContent="Transaction saved."; e.target.reset(); await load();
  }catch(err){statusBox.textContent=err.message;}
});
load();
</script>
</body>
</html>
