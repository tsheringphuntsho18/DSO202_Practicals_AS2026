apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-nginx
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location /api/ {
        proxy_pass http://{{ .Release.Name }}-backend:{{ .Values.global.backendPort | default 3001 }}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
      location / {
        try_files $uri $uri/ =404;
      }
    }
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>{{ .Values.pageTitle }}</title>
      <style>
        body{font-family:Arial,sans-serif;margin:0;background:#f4f6fb;color:#172334}
        header{background:#173b68;color:white;padding:24px 7%}
        main{max-width:850px;margin:30px auto;padding:0 18px}
        section{background:white;border-radius:12px;padding:20px;margin-bottom:18px}
        input,select,button{padding:10px;margin:5px;border:1px solid #ccd4df;border-radius:7px}
        button{background:#1765ad;color:white;border:0}
        table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}
      </style>
    </head>
    <body>
      <header><h1>{{ .Values.pageTitle }}</h1><p>{{ .Values.pageMessage }}</p><small>Environment: {{ .Values.global.environment | default "dev" }}</small></header>
      <main>
        <section><h2>Add transaction</h2>
          <form id="form">
            <input id="customer" placeholder="Customer" required maxlength="80">
            <select id="type"><option value="CREDIT">Credit</option><option value="PAYMENT">Payment</option></select>
            <input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required>
            <input id="note" placeholder="Note">
            <button>Save</button>
          </form><p id="status"></p>
        </section>
        <section><h2>Transaction history</h2>
          <table><thead><tr><th>Customer</th><th>Type</th><th>Amount</th><th>Note</th></tr></thead><tbody id="rows"></tbody></table>
        </section>
      </main>
      <script>
        const rows=document.querySelector('#rows'), status=document.querySelector('#status');
        async function refresh(){
          const r=await fetch('/api/transactions'); const data=await r.json(); rows.innerHTML='';
          data.forEach(x=>{const tr=document.createElement('tr');[x.customer,x.type,Number(x.amount).toFixed(2),x.note||''].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});rows.appendChild(tr)});
          if(!data.length) rows.innerHTML='<tr><td colspan="4">No transactions yet</td></tr>';
        }
        document.querySelector('#form').addEventListener('submit',async e=>{
          e.preventDefault(); const payload={customer:document.querySelector('#customer').value,type:document.querySelector('#type').value,amount:Number(document.querySelector('#amount').value),note:document.querySelector('#note').value};
          const r=await fetch('/api/transactions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
          const data=await r.json(); status.textContent=r.ok?'Saved':(data.error||'Request failed'); if(r.ok){e.target.reset();refresh()}
        });
        refresh().catch(e=>status.textContent=e.message);
      </script>
    </body></html>
