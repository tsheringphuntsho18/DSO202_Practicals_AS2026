global:
  environment: dev

frontend:
  enabled: true
  replicaCount: 1
  pageTitle: "Credit Book"
  pageMessage: "A Helm-managed three-tier application."
  image:
    repository: creditbook-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: creditbook-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 3001
  database:
    host: creditbook-database
    port: 5432
    secretName: creditbook-db

database:
  enabled: true
  replicas: 1
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""
  secretName: creditbook-db
