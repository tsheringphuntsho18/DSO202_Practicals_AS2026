global:
  environment: dev

frontend:
  replicaCount: 1
  pageTitle: "Credit Book — Development"
  pageMessage: "Development environment: Record all credit transactions."
  image:
    repository: creditbook-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent

backend:
  replicaCount: 1
  image:
    repository: creditbook-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  database:
    host: creditbook-database
    port: 5432
    secretName: creditbook-db

database:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""
  secretName: creditbook-db
  replicas: 1
