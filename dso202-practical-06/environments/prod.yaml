global:
  environment: prod

frontend:
  replicaCount: 2
  pageTitle: "Credit Book"
  pageMessage: "Production configuration preview."
  image:
    repository: creditbook-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

backend:
  replicaCount: 2
  image:
    repository: creditbook-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  database:
    host: creditbook-database
    port: 5432
    secretName: creditbook-db
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

database:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""
  secretName: creditbook-db
  replicas: 1
