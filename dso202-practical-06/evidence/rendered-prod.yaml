apiVersion: apps/v1
kind: Deployment
metadata:
  name: creditbook-prod-frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: creditbook-prod
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "frontend-0.1.0"
    dso202/environment: "prod"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/instance: creditbook-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/instance: creditbook-prod
        app.kubernetes.io/component: frontend
      annotations:
        checksum/config: e18e498a2008acbe1f9bcad87d444f875113c5914ef7c1f14423c18bdd0892d6
    spec:
      containers:
        - name: frontend
          image: "creditbook-frontend:1.0.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: creditbook-prod-frontend-nginx
        - name: nginx-html
          configMap:
            name: creditbook-prod-frontend-nginx
