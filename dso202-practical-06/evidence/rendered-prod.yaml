apiVersion: v1
kind: Pod
metadata:
  name: creditbook-prod-test-connection
  labels:
    app.kubernetes.io/instance: creditbook-prod
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          wget -qO- http://creditbook-prod-frontend/ | grep -q "Credit Book"
          wget -qO- http://creditbook-prod-frontend/api/health | grep -q '"status":"ok"'
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
