apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-staging

resources:
- ../../base
- namespace.yaml


replicas:
- count: 2
  name: webapp

configMapGenerator:
- behavior: replace
  files:
  - index.html
  name: web-content
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/environment: staging
