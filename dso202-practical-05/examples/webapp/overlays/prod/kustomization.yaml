apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-prod

resources:
- ../../base
- namespace.yaml


replicas:
- count: 3
  name: webapp

configMapGenerator:
- behavior: replace
  files:
  - index.html
  name: web-content

patches:
- path: patch-resources.yaml
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/environment: prod
