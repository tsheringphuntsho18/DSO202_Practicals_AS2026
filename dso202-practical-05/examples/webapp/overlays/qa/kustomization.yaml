apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-qa

resources:
- ../../base
- namespace.yaml


replicas:
- count: 2
  name: webapp

configMapGenerator:
- behavior: replace
  files:
  - index.html
  name: web-content

patches:
- path: patch-annotation.yaml
  target:
    group: apps
    kind: Deployment
    name: webapp
    version: v1
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/environment: qa
