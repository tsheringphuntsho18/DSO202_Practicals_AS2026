apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/environment: prod
  name: webapp-prod
---
apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Production Environment</title>
    </head>
    <body>
        <h1>Welcome to the Production Environment</h1>
        <p>This is the PROD environment.</p>
    </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/environment: prod
  name: web-content-4fhtdgt247
  namespace: webapp-prod
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/environment: prod
    app.kubernetes.io/name: webapp
  name: webapp
  namespace: webapp-prod
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app.kubernetes.io/environment: prod
    app.kubernetes.io/name: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/environment: prod
    app.kubernetes.io/name: webapp
  name: webapp
  namespace: webapp-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/environment: prod
      app.kubernetes.io/name: webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: prod
        app.kubernetes.io/name: webapp
    spec:
      containers:
      - image: nginx:1.27
        name: nginx
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: web-content
          readOnly: true
      volumes:
      - configMap:
          name: web-content-4fhtdgt247
        name: web-content
