apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/environment: dev
  name: webapp-dev
---
apiVersion: v1
data:
  index.html: |-
    <!DOCTYPE html>
    <html>
    <head>
        <title>Development Environment</title>
    </head>
    <body>
        <h1>Welcome to the Development Environment</h1>
        <p>This is the DEV environment.</p>
    </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/environment: dev
  name: web-content-42gc78f88t
  namespace: webapp-dev
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/environment: dev
    app.kubernetes.io/name: webapp
  name: webapp
  namespace: webapp-dev
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app.kubernetes.io/environment: dev
    app.kubernetes.io/name: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/environment: dev
    app.kubernetes.io/name: webapp
  name: webapp
  namespace: webapp-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/environment: dev
      app.kubernetes.io/name: webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: dev
        app.kubernetes.io/name: webapp
    spec:
      containers:
      - image: nginx:1.27
        name: nginx
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: web-content
          readOnly: true
      volumes:
      - configMap:
          name: web-content-42gc78f88t
        name: web-content
