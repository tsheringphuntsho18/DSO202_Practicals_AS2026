apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/environment: qa
  name: webapp-qa
---
apiVersion: v1
data:
  index.html: |-
    <!DOCTYPE html>
    <html>
    <head>
        <title>QA Environment</title>
    </head>
    <body>
        <h1>Welcome to the QA Environment</h1>
        <p>This is the QA environment.</p>
    </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/environment: qa
  name: web-content-bfc42649t2
  namespace: webapp-qa
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/environment: qa
    app.kubernetes.io/name: webapp
  name: webapp
  namespace: webapp-qa
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app.kubernetes.io/environment: qa
    app.kubernetes.io/name: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/environment: qa
    app.kubernetes.io/name: webapp
  name: webapp
  namespace: webapp-qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/environment: qa
      app.kubernetes.io/name: webapp
  template:
    metadata:
      annotations:
        training.example.com/owner: qa-team
      labels:
        app.kubernetes.io/environment: qa
        app.kubernetes.io/name: webapp
    spec:
      containers:
      - image: nginx:1.27
        name: nginx
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: web-content
          readOnly: true
      volumes:
      - configMap:
          name: web-content-bfc42649t2
        name: web-content
